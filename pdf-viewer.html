<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Urdu PDF Reader & Translator</title>
  <link rel="stylesheet" href="pdf-viewer.css">
  <!-- Load core PDF.js library -->
  <script src="lib/pdf.mjs" type="module"></script>
</head>
<body>
  <div id="viewer-toolbar">
    <span id="title-label">Urdu PDF Viewer</span>
    <div id="pagination-controls">
      <button id="prev-page">Previous</button>
      <span>Page <span id="page-num">1</span> of <span id="page-count">--</span></span>
      <button id="next-page">Next</button>
    </div>
  </div>

  <div id="viewer-container">
    <canvas id="pdf-canvas"></canvas>
  </div>

  <script src="pdf-viewer.js" type="module"></script>
</body>
</html>
