<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Urdu Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>Urdu Translator</h2>
    
    <div class="toggle-section">
      <label class="switch">
        <input type="checkbox" id="toggle-switch">
        <span class="slider round"></span>
      </label>
      <span id="status-text">Extension Enabled</span>
    </div>

    <hr>

    <div class="pdf-section">
      <h3>PDF Tools</h3>
      <button id="open-pdf-btn">Open PDF File</button>
      <input type="file" id="local-pdf-input" accept="application/pdf" style="display: none;">
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
